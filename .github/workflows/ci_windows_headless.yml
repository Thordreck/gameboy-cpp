name: Run Headless Tests (Windows)
on:
  push:
jobs:
  run-ctest-window:
    name: Run Ctest
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: win64
          toolset: 14.51

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.3'

      - name: Configure & Build
        uses: lukka/run-cmake@v10
        env:
          VCPKG_ROOT:
        with:
          configurePreset: 'ninja-no-profiling-headless-debug'
          buildPreset: 'ninja-no-profiling-headless-debug'
          buildPresetAdditionalArgs: "[`--parallel`]"
          testPreset: 'test-all-headless'
          testPresetCmdString: "[`--output-junit`, String.raw`${{runner.temp}}/test-results.xml`, `--parallel`, `--preset`, `$[env.TEST_PRESET_NAME]`]"

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: '${{runner.temp}}/*.xml'
          github-report: true
          integrations-config: |
            {
              "junit-to-ctrf": {
                "enabled": true,
                "action": "convert",
                "options": {
                  "output": "./test-report.json",
                  "toolname": "junit-to-ctrf",
                  "useSuiteName": true
                }
              }
            }
        if: always()